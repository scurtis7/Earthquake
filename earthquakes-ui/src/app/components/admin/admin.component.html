<div class="card admin-layout">
  <h2>Load Raw Earthquake Data</h2>
  <h3>Last Date: {{ lastDate }}</h3>
  @if (lastDateError) {
    <p-message severity="error" icon="pi pi-times-circle" [text]="lastDateError"/>
  }
  <div class="filters-row">
    <div class="filter-field">
      <label for="startDate">Start Date (inclusive)</label>
      <p-datepicker
        inputId="startDate"
        [(ngModel)]="startDate"
        [minDate]="minDate"
        [maxDate]="startMaxDate"
        dateFormat="yy-mm-dd"
        showIcon></p-datepicker>
    </div>
    <div class="filter-field">
      <label for="endDate">End Date (exclusive)</label>
      <p-datepicker
        inputId="endDate"
        [(ngModel)]="endDate"
        [minDate]="endMinDate"
        [maxDate]="maxDate"
        dateFormat="yy-mm-dd"
        showIcon></p-datepicker>
    </div>
    <p-button
      id="loadButton"
      label="Load Data"
      icon="pi pi-download"
      [loading]="loading"
      [disabled]="loading"
      (onClick)="loadData()"/>
    <p-button
      id="updateCounts"
      label="Update Counts"
      icon="pi pi-refresh"
      [loading]="loading"
      [disabled]="loading"
      (onClick)="updateCounts()"/>
  </div>
  @if (loading) {
    <div class="progress">
      <p-progressbar mode="indeterminate" [style]="{ height: '0.5rem' }"/>
      <span>{{ progressMessage }} ({{ elapsedTime }})</span>
    </div>
  }
  @if (loadError) {
    <p-message severity="error" icon="pi pi-times-circle" [text]="loadError"/>
  }
  @if (loadResponse) {
    <p-message severity="success" icon="pi pi-check-circle" [text]="loadResponse"/>
  }
</div>
